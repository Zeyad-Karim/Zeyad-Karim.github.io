title: z3y4d
description: "Cybersecurity writeups, CTF solutions, and hacking adventures."
url: "https://Zeyad-Karim.github.io"
baseurl: ""
author:
  name: z3y4d
  email: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /writeups/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git

# Feed
feed:
  path: feed.xml
