title: z3y4d
email: ""
description: "Cybersecurity writeups, CTF solutions, and hacking adventures."
url: "https://Zeyad-Karim.github.io"
baseurl: ""
author: z3y4d
github_username: Zeyad-Karim

markdown: kramdown
highlighter: rouge
permalink: /writeups/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 5
paginate_path: "/page/:num/"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
