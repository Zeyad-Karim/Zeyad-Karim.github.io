title: z3y4d // security research
description: "Offensive security, Android, Active Directory, and web security research by Zeyad Karim."
url: "https://zeyad-karim.github.io"
baseurl: ""
author:
  name: Zeyad Karim
  email: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /writeups/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Zeyad Karim"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git
  - source-pdfs
  - tmp

# Feed
feed:
  path: feed.xml
